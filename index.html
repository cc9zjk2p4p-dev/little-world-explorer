:root{--ink:#24345b;--muted:#65738e;--blue:#5b9de8;--green:#45b98b;--yellow:#ffd66e;--pink:#ff9fb3;--paper:#fffdf8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(160deg,#dff4ff,#fff4d9 55%,#fce5f0);padding:16px 12px 32px}

.question{text-align:center;background:#f4faff;border-radius:22px;padding:15px 10px 18px}.qtitle{font-weight:900;font-size:20px}.sub{color:var(--muted);font-size:13px;font-weight:650;margin-top:4px}.flag{font-size:clamp(74px,18vw,112px);line-height:1.35;margin:10px 0;text-shadow:0 4px 0 #e2eaf0}.hint{font-size:13px;color:#58718c;font-weight:700}

function startGame(){

function nextQuestion(){

}
function choose(c,button){
 if(locked)return;locked=true;const correct=c.code===current.code;

 else{streak=0;button.classList.add('wrong');$('feedback').innerHTML=`<div class="big">괜찮아요! 한 번 더 배워봐요 💛</div><div class="name">${current.flag} ${current.ko}</div><div>${current.en}</div>`}
